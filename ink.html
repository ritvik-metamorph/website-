  <script>
    // Local testing only: ?frames=timer runs animation on a timer, for when the browser pane is hidden.
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /frames=timer/.test(location.search)) {
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = clearTimeout;
    }
    // (the simple site is Ink: arriving here, that is the version this visitor is reading)
    try { localStorage.setItem('mm-mode', 'ink'); } catch (e) {}
  </script>

<!-- The nav, as on every page: the wordmark and links in one glass pill, the version in its own, and
     the one thing to do. In the simple site its links stay in the simple site; Light goes to the
     creative twin of this page (js/site.js). -->
<header class="nav" data-tone="light">
  <!-- (18 Nov) one tab hanging from the middle of the top edge: Menu (the full-screen menu, js/menu.js), the name, Talk to us -->
  <div class="nav-tab">

    <a class="nav-cta" href="#contact" data-soon>Talk to us</a>

</header>
  <main id="top" class="ik-solo" data-foot="none">
    <!-- The hero: a film, full bleed, the line over it. The film is to be the evolution of people
         (the user's idea, 16 Nov). Until it exists, a reel stands in: the way in's silver cocoon spun,
         closed, opening and flown, drawn in code (assets/ink/film-*.jpg, made on refs/ink-renders.html),
         each frame drifting slowly into the next. Put the film's address in data-src (an MP4, muted,
         about 15 to 30 seconds, made to loop) and it plays over the reel (js/ink-home.js); data-poster
         takes a still for before it starts. -->
    <!-- (19 Nov, the user's sketch) the film in a frame hanging from the top edge between the margins, on the paper,
         the nav's tab over its top; the line under it on the paper, as wide as the frame; the sentence, the two ways
         in and the practice's line on the film's darker foot. The full-bleed film before: backup
         simple-hero-before-frame-2026-11-19 -->
    <section class="ik-hero" data-tone="light" aria-labelledby="ik-hero-title">
      <div class="ik-frame">
        <div class="ik-film" aria-hidden="true">
          <div class="ik-film-in">
            <div class="ik-reel">
              <img src="assets/ink/film-1-spun.jpg" alt="" fetchpriority="high">
              <img data-src="assets/ink/film-2-cocoon.jpg" alt="">
              <img data-src="assets/ink/film-3-opening.jpg" alt="">
              <img data-src="assets/ink/film-4-wings.jpg" alt="">
              <img data-src="assets/ink/film-5-flight.jpg" alt="">
            </div>
            <video class="ik-film-v" muted loop playsinline preload="none" data-src="" data-poster=""></video>
          </div>
        </div>
      </div>
      <!-- (19 Nov, later; the user, with a sketch: "instead of putting the text on the video… put the text adjacent to
           the main heading") the film clear of words; on the paper under it the line, and beside it the firm's sentence,
           the practice's line and the one link (the film's placeholder tag dropped; README keeps the film as a placeholder). On the film's corners before: backup
           simple-hero-before-side-words-2026-11-19 -->
      <div class="ik-hero-foot">
        <!-- (20 Nov; the user: "a lot of negative space just below the capital that transforms") the practice's line under
             the headline, so the two sides end together: the line and the practice at the left, the sentence and the two
             ways on at the right. Before: backup simple-hero-before-even-foot-2026-11-20 -->
        <div class="ik-hero-line">
          <h1 id="ik-hero-title" class="title" data-turn="letters" data-chars="hero">Capital that <em>transforms.</em></h1>
          <p class="ik-hero-proof ik-rise" style="--d:.9s">Backed by a 30-year chartered accountancy practice.</p>
        </div>
        <div class="ik-hero-in ik-rise" style="--d:.7s">
          <p class="ik-hero-sub">We raise capital, sharpen strategy and grow wealth for founders in the middle of becoming.</p>
          <!-- (20 Nov) the two ways on together: Raise capital, and the change-of-version button seated in the slot beside it
               (js/ink-home.js), which glides down to its corner as the page is read -->
          <div class="ik-hero-ways">
            <a class="ik-raise" href="#contact" data-soon>Raise capital <svg viewBox="0 0 22 12" aria-hidden="true"><path d="M0 6h20M15 1l5 5-5 5"/></svg></a>
            <span class="ik-vx-slot" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- (21 Nov, the user: the About content came twice on the simple site, here under the hero and on the simple
         About; it is to be in About only, and the hero is not to scroll on into it) The home is the hero alone, one
         screen, with no foot under it (data-foot). What was under it, each already on its own page: the firm's
         dictionary entry and its four numbers (now the simple About's opening), the four services (About, Services),
         how we decide (About's values), the team (now on About, #team), the founder's grid (Sectors), the corner's
         work (the Creative Corner), the end (About). Backup simple-home-before-hero-only-2026-11-21. -->
